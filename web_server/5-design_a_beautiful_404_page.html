<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --sky: #6fa3d8;
    --sky-deep: #3f78b5;
    --cloud: #f7fbff;
    --paper: #fffdf6;
    --ink: #1c2b3a;
    --apple: #5d9a3c;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--sky-deep), var(--sky) 70%);
    color: var(--ink);
    font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    display: grid;
    place-items: center;
    overflow-x: hidden;
    padding: 24px;
  }
  .cloud {
    position: fixed;
    background: var(--cloud);
    border-radius: 999px;
    opacity: .9;
    filter: blur(1px);
    animation: drift 60s linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .c1 { width: 190px; height: 50px; top: 12%; left: -220px; }
  .c1::before { width: 80px; height: 80px; top: -38px; left: 30px; }
  .c1::after { width: 60px; height: 60px; top: -26px; left: 100px; }
  .c2 { width: 260px; height: 64px; top: 68%; left: -300px; animation-duration: 90s; animation-delay: -35s; }
  .c2::before { width: 110px; height: 110px; top: -52px; left: 40px; }
  .c2::after { width: 80px; height: 80px; top: -34px; left: 140px; }
  @keyframes drift { to { transform: translateX(calc(100vw + 340px)); } }

  main { position: relative; text-align: center; max-width: 560px; }
  .page {
    width: 190px; height: 240px; margin: 0 auto 28px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 4px 40px 4px 4px;
    position: relative;
    box-shadow: 12px 14px 0 rgba(28, 43, 58, .22);
    transform: rotate(-4deg);
  }
  .page::before {
    content: ""; position: absolute; top: -3px; right: -3px;
    width: 46px; height: 46px;
    background: linear-gradient(225deg, var(--sky) 50%, #d9d4c0 50%);
    border-left: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
    border-radius: 0 0 0 8px;
  }
  .page svg { position: absolute; left: 28px; bottom: 26px; width: 110px; }
  .page .big {
    position: absolute; left: 0; right: 0; top: 56px;
    font-size: 64px; font-weight: 700; letter-spacing: 2px;
  }
  .caption {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", "Lucida Handwriting", cursive;
    font-size: clamp(28px, 6vw, 44px);
    color: var(--paper);
    text-shadow: 2px 2px 0 rgba(28, 43, 58, .35);
    line-height: 1.25;
    margin-bottom: 14px;
  }
  .note { color: var(--paper); font-size: 18px; line-height: 1.5; margin-bottom: 26px; max-width: 46ch; margin-inline: auto; }
  a.home {
    display: inline-block; background: var(--paper); color: var(--ink);
    text-decoration: none; font-weight: 700; font-size: 17px;
    padding: 12px 26px; border: 3px solid var(--ink); border-radius: 999px;
    box-shadow: 4px 5px 0 var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  a.home:hover { transform: translate(2px, 2px); box-shadow: 2px 3px 0 var(--ink); }
  a.home:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) {
    .cloud { animation: none; left: 8%; }
    .c2 { left: 55%; }
    a.home { transition: none; }
  }
</style>
</head>
<body>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <main>
    <div class="page" aria-hidden="true">
      <div class="big">404</div>
      <svg viewBox="0 0 110 60"><path d="M10 52 Q55 -10 100 52" fill="none" stroke="#1c2b3a" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/><circle cx="55" cy="36" r="12" fill="#5d9a3c" stroke="#1c2b3a" stroke-width="3"/><path d="M55 24 Q57 15 64 13" fill="none" stroke="#1c2b3a" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
    <h1 class="caption">Ceci n'est pas une page</h1>
    <p class="note">Error 404: the page you asked for does not exist. It may have moved, or the link may have a typo.</p>
    <a class="home" href="/">Back to the home page</a>
  </main>
</body>
</html>
